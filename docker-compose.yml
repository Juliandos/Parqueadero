version: '3.8'

services:
  # Aplicación Flask
  app:
    build: .
    container_name: parqueadero-app
    restart: unless-stopped
    environment:
      - FLASK_APP=main.py
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - SQLALCHEMY_DATABASE=sqlite:////app/data/app.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "5000:5000"
    networks:
      - parqueadero-network
    depends_on:
      - nginx

  # Nginx como proxy reverso
  nginx:
    image: nginx:alpine
    container_name: parqueadero-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - parqueadero-network
    depends_on:
      - app

networks:
  parqueadero-network:
    driver: bridge

volumes:
  data:
  logs:
