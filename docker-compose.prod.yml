  #     - POSTGRES_DB=parqueadero_db
  #     - POSTGRES_USER=${DB_USER}
  #     - POSTGRES_PASSWORD=${DB_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./backups:/backups
  #   networks:
  #     - parqueadero-network
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 256M
  #         cpus: '0.25'
  #       reservations:
  #         memory: 128M
  #         cpus: '0.1'

  # Redis para caché (opcional)
  # redis:
  #   image: redis:7-alpine
  #   container_name: parqueadero-redis-prod
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - parqueadero-network
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 64M
  #         cpus: '0.1'
  #       reservations:
  #         memory: 32M
  #         cpus: '0.05'

  # Monitor de logs (opcional)
  # logrotate:
  #   image: blacklabelops/logrotate
  #   container_name: parqueadero-logrotate
  #   restart: unless-stopped
  #   volumes:
  #     - ./logs:/logs
  #     - ./nginx/logrotate.conf:/etc/logrotate.d/nginx:ro
  #   environment:
  #     - LOGS_DIRECTORIES=/logs
  #     - LOGROTATE_INTERVAL=daily
  #     - LOGROTATE_COPIES=7
  #     - LOGROTATE_SIZE=100M

networks:
  parqueadero-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: parqueadero-br

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  logs:
    driver: local
