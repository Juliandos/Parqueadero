<!-- periodicidad.html -->
{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}

<div class="sherah-adashboard sherah-show">
  <h2 class="m-4">{{ titulo }}</h2>
  <div class="example_wrapper">
    <button class="btn btn-primary m-3" id="btnAgregar">
      <i class="fas fa-plus"></i>
    </button>
    <table id="TablePeriodicidad" class="table table-striped table-bordered">
      <thead class="table-blue">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Días</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        {% for p in periodicidades %}
        <tr>
          <td>{{ p.id }}</td>
          <td>{{ p.nombre }}</td>
          <td>{{ p.dias }}</td>
          <td>
            <button class="btn btn-warning btn-sm btnEditar" title="Editar" data-id="{{ p.id }}">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-danger btn-sm btnEliminar" title="Eliminar" data-id="{{ p.id }}">
              <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <div id="periodicidadesData" data-periodicidades='{{ periodicidades | tojson | safe }}'></div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="Modal1" tabindex="-1" aria-labelledby="Modal1Label" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="Modal1Label">Agregar Periodicidad</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="PeriodicidadForm">
          <input type="hidden" id="PeriodicidadId" />
          
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control text-dark" id="nombre" required>
          </div>

          <div class="mb-3">
            <label for="dias" class="form-label">Días</label>
            <input type="number" class="form-control text-dark" id="dias" min="1" required>
          </div>

          <button type="submit" class="btn btn-success">Guardar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  $(document).ready(function () {
    $("#TablePeriodicidad").DataTable({
      paging: true,
      searching: true,
      ordering: true,
      language: {
        lengthMenu: "Mostrar _MENU_ registros por página",
        zeroRecords: "No se encontraron resultados",
        info: "Mostrando _START_ a _END_ de _TOTAL_ registros",
        infoEmpty: "No hay registros disponibles",
        search: "Buscar:",
        paginate: {
          first: "<<",
          last: ">>",
          next: ">",
          previous: "<",
        },
      },
    });

    $("#TablePeriodicidad").DataTable();

    $("#btnAgregar").click(function () {
      $("#Modal1Label").text("Crear Periodicidad");
      $("#PeriodicidadForm").attr("data-action", "create");
      $("#PeriodicidadForm")[0].reset();
      $("#Modal1").modal("show");
    });

    $("#TablePeriodicidad").on("click", ".btnEditar", function () {
      let row = $(this).closest("tr");
      let periodicidades = JSON.parse(document.getElementById("periodicidadesData").dataset.periodicidades);
      let periodicidadId = row.find("td:eq(0)").text();
      let periodicidad = periodicidades.find(p => p.id == periodicidadId);

      $("#Modal1Label").text("Editar Periodicidad");
      $("#PeriodicidadForm").attr("data-action", "edit");
      $("#PeriodicidadId").val(periodicidadId);
      $("#nombre").val(periodicidad.nombre);
      $("#dias").val(periodicidad.dias);

      $("#Modal1").modal("show");
    });

    $("#PeriodicidadForm").submit(function (event) {
      event.preventDefault();
      let action = $(this).attr("data-action");
      let url = action === "edit" ? `/periodicidad/edit/${$("#PeriodicidadId").val()}` : "/periodicidad/add";
      let method = action === "edit" ? "PUT" : "POST";

      $.ajax({
        url: url,
        type: method,
        contentType: "application/json",
        data: JSON.stringify({
          nombre: $("#nombre").val(),
          dias: $("#dias").val()
        }),
        success: function () {
          Swal.fire("Éxito", "Periodicidad guardada", "success").then(() => location.reload());
        }
      });
      $("#Modal1").modal("hide");
    });

    $("#TablePeriodicidad").on("click", ".btnEliminar", function () {
      let id = $(this).data("id");
      Swal.fire({
        title: "¿Estás seguro?",
        text: "Esta acción no se puede deshacer",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#d33",
        cancelButtonColor: "#3085d6",
        confirmButtonText: "Sí, eliminar"
      }).then((result) => {
        if (result.isConfirmed) {
          $.ajax({
            url: `/periodicidad/delete/${id}`,
            type: "POST",
            data: { _method: "DELETE" },
            success: function () {
              Swal.fire("Eliminado", "Periodicidad eliminada", "success").then(() => location.reload());
            },
            error: function(jqXHR, textStatus, errorThrown) {
              let response = jqXHR.responseJSON;
              let message = response && response.message ? response.message : "Error desconocido";

              Swal.fire("Error", message, "error");
            }
          });
        }
      });
    });
  });
</script>
{% endblock %}
