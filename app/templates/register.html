{% extends 'base_login_registro.html' %}
{% block title %}Registro{% endblock %}
{% block content %}
<div class="container-fluid vh-100">
  <div class="row h-100 justify-content-center align-items-center">
    <div class="col-md-4 d-none d-md-block">
      <img src="{{ url_for('static', filename='images/register-image.jpg') }}" alt="Register Image" class="img-fluid">
    </div>
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Registro</h2>
          <form id="registerForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="documento" class="form-label">Documento</label>
                <input type="text" class="form-control" id="documento" name="documento" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="contrasena" name="contrasena" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="nombres" class="form-label">Nombres</label>
                <input type="text" class="form-control" id="nombres" name="nombres" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input type="text" class="form-control" id="apellidos" name="apellidos" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="tel" class="form-control" id="telefono" name="telefono" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="ciudad" class="form-label">Ciudad</label>
                <input type="text" class="form-control" id="ciudad" name="ciudad" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="direccion" name="direccion" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="rol_id" class="form-label">Rol</label>
                <select class="form-control" id="rol_id" name="rol_id" required>
                  <option value="">Seleccione un Rol</option>
                  {% for rol in roles %}
                  <option value="{{ rol.id }}">{{ rol.nombre }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-success">Registrarse</button>
            </div>
          </form>
          <div class="mt-3 text-center">
            <a href="{{ url_for('routes.login') }}">¿Ya tienes una cuenta? Inicia Sesión</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  $(document).ready(function () {
    // Manejar el envío del formulario de registro
    $('#registerForm').submit(function (event) {
      event.preventDefault(); // Evitar el envío tradicional del formulario

      // Obtener los datos del formulario
      const formData = {
        documento: $('#documento').val(),
        contrasena: $('#contrasena').val(),
        nombres: $('#nombres').val(),
        apellidos: $('#apellidos').val(),
        telefono: $('#telefono').val(),
        email: $('#email').val(),
        ciudad: $('#ciudad').val(),
        direccion: $('#direccion').val(),
        rol_id: $('#rol_id').val(),
      };

      // Enviar los datos mediante AJAX
      $.ajax({
        url: "{{ url_for('routes.add_usuario') }}",
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify(formData),
        success: function (response) {
          if (response.success) {
            Swal.fire({
              icon: 'success',
              title: 'Éxito',
              text: response.message,
            }).then(() => {
              window.location.href = "{{ url_for('routes.login') }}"; // Redirigir al login
            });
          } else {
            Swal.fire({
              icon: 'error',
              title: 'Error',
              text: response.message,
            });
          }
        },
        error: function (xhr) {
          Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'Ocurrió un error al registrar el usuario.',
          });
        },
      });
    });
  });
</script>
{% endblock %}
