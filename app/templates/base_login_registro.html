<!DOCTYPE html>
<html lang="es no-js" lang="zxx">

<head>
  <!-- Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashboard - Sherah{% endblock %}</title>

  <!-- Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&display=swap"
    rel="stylesheet">

  <!-- Fav Icon -->
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/font-awesome-all.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/jvector-map.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/jquery-ui.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

  <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/loadingoverlay.min.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>


  <style>
    .password-column {
      max-width: 100px;
      /* Ajusta según necesidad */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .error{
      color: red;
      font-size: 12px;
      width: 100%;
    }
  </style>

</head>

<body id="sherah-dark-light">


  <div class="sherah-body-area">

    {% block content %}

    {% endblock %}

  </div>

  <!-- sherah Scripts -->
  <script src="{{ url_for('static', filename='js/jquery-migrate.js') }}"></script>
  <script src="{{ url_for('static', filename='js/jquery-ui.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/popper.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/circle-progress.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/jquery-jvectormap.js') }}"></script>
  <script src="{{ url_for('static', filename='js/jvector-map.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
