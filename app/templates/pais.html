{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}

<div class="sherah-adashboard sherah-show">
  <h2 class="m-4">{{ titulo }}</h2>
  <div class="example_wrapper">
    <button class="btn btn-primary m-3" id="btnAgregar">
      <i class="fas fa-plus"></i>
    </button>
    <table id="TablePais" class="table table-striped table-bordered">
      <thead class="table-blue">
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Creado</th>
        </tr>
      </thead>
      <tbody>
        {% for pais in paises %}
        <tr>
          <td>{{ pais.id }}</td>
          <td>{{ pais.nombre }}</td>
          <td>
            <button class="btn btn-warning btn-sm btnEditar" data-id="{{ pais.id }}">
              <i class="fas fa-edit"></i>
            </button>
            <button class="btn btn-danger btn-sm btnEliminar" data-id="{{ pais.id }}">
              <i class="fas fa-trash-alt"></i>
            </button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <div id="paisesData" data-paises='{{ paises | tojson | safe }}'></div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="ModalPais" tabindex="-1" aria-labelledby="ModalPaisLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="ModalPaisLabel">Agregar País</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="PaisForm">
          <input type="hidden" id="PaisId" />

          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del País</label>
            <input type="text" class="form-control" id="nombre" required>
          </div>

          <button type="submit" class="btn btn-success">Guardar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  $(document).ready(function () {
    $("#TablePais").DataTable({
      order: [[3, 'desc']],
      paging: true,
      searching: true,
      ordering: true,
      language: {
        lengthMenu: "Mostrar _MENU_ registros por página",
        zeroRecords: "No se encontraron resultados",
        info: "Mostrando _START_ a _END_ de _TOTAL_ registros",
        infoEmpty: "No hay registros disponibles",
        search: "Buscar:",
        paginate: {
          first: "<<",
          last: ">>",
          next: ">",
          previous: "<",
        },
      },
    });

    $("#btnAgregar").click(function () {
      $("#ModalPaisLabel").text("Crear País");
      $("#PaisForm").attr("data-action", "create");
      $("#PaisForm")[0].reset();
      $("#ModalPais").modal("show");
    });

    $("#TablePais").on("click", ".btnEditar", function () {
      let row = $(this).closest("tr");
      let paises = JSON.parse(document.getElementById("paisesData").dataset.paises);
      let paisId = row.find("td:eq(0)").text();
      let pais = paises.find(p => p.id == paisId);

      $("#ModalPaisLabel").text("Editar País");
      $("#PaisForm").attr("data-action", "edit");
      $("#PaisId").val(paisId);
      $("#nombre").val(pais.nombre);

      $("#ModalPais").modal("show");
    });

    $("#PaisForm").submit(function (event) {
      event.preventDefault();
      let action = $(this).attr("data-action");
      let url = action === "edit" ? `/pais/edit/${$("#PaisId").val()}` : "/pais/add";
      let method = action === "edit" ? "PUT" : "POST";

      $.ajax({
        url: url,
        type: method,
        contentType: "application/json",
        data: JSON.stringify({
          nombre: $("#nombre").val()
        }),
        success: function () {
          Swal.fire("Éxito", "País guardado", "success").then(() => location.reload());
        },
        error: function (xhr) {
          Swal.fire("Error", xhr.responseJSON?.message || "Error desconocido", "error");
        }
      });
      $("#ModalPais").modal("hide");
    });

    // Eliminar
    $("#TablePais").on("click", ".btnEliminar", function () {
      let id = $(this).data("id");
      Swal.fire({
        title: "¿Estás seguro?",
        text: "Esta acción no se puede deshacer",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#d33",
        cancelButtonColor: "#3085d6",
        confirmButtonText: "Sí, eliminar"
      }).then((result) => {
        if (result.isConfirmed) {
          $.ajax({
            url: `/pais/delete/${id}`,
            type: "POST",
            data: { _method: "DELETE" },
            success: function () {
              Swal.fire("Eliminado", "País eliminado", "success").then(() => location.reload());
            }
          });
        }
      });
    });
  });
</script>
{% endblock %}
